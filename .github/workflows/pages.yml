name: Deploy user guide to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'samples/**'
      - 'scripts/*samples.mjs'
      - 'scripts/prepare-pages.mjs'
      - 'dist/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - run: node scripts/prepare-pages.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload documentation site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" -eq 1 ]; then
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "::error::Multiple github-pages artifacts exist; start a new workflow run."
              exit 1
            fi
            sleep 5
          done
          echo "::error::The github-pages artifact did not become visible in time."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
